name: fingerprint_sdk
description: >
  A Flutter plugin for Q818 fingerprint hardware integration.
  Capture images, generate ISO/ANSI templates, and compare fingerprints.

version: 1.1.2
homepage: https://github.com/Drebyte/q818_fingerprint_plugin
repository: https://github.com/Drebyte/q818_fingerprint_plugin
issue_tracker: https://github.com/Drebyte/q818_fingerprint_plugin/issues
documentation: https://github.com/Drebyte/q818_fingerprint_plugin#readme

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

topics:
  - fingerprint
  - biometrics
  - plugin
  - q818
  - flutter

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.drebyte.fingerprint_sdk
        pluginClass: FingerprintSdkPlugin

